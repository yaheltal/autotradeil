name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hit /health
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://autotradeil.onrender.com' }}
        run: |
          curl -fL --max-time 30 \
            -H "User-Agent: github-actions-keepalive/1.0" \
            "$API_BASE_URL/health"
